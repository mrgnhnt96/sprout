# GATE ON THE COMMAND CI RUNS, NOT A LOCAL EQUIVALENT OF IT.
#
# The natural rule to write here is the ergonomic local one, and it inherits none of this gate's
# promise. A consumer ran `flutter analyze lib` for a year against a CI that ran
# `dart analyze --fatal-infos` over the whole tree: two differences — scope, and whether infos are
# fatal — neither visible by reading the rule, and the gate reported the same green either way.
#
# That is the "check that cannot fail" one level up. Not a command that cannot fail, but one that
# fails at DIFFERENT THINGS than the command that decides whether your change is actually good.
#
# So: paste CI's command. If you genuinely cannot run it locally — it needs a runner, a service, a
# platform you do not have — write the difference in a comment ABOVE the rule, in the two terms that
# actually diverge: what it covers, and what it treats as fatal. A named difference is a decision;
# an unnamed one is a surprise with a green tick in front of it.

# WHAT MUST BE RUN WHEN A THING CHANGES.
#
# The rule this encodes: if a change has an OUTPUT that is not the thing you edited — a code
# generator, template, migration, schema, serializer, IaC, build script — no verification counts
# until the output's real consumer has consumed it. A generator's own test comparing emitted text to
# emitted text, an analyzer configured to exclude the output dir, a downstream that exercises none of
# the changed code: three green signals, all vacuous, none lying.
#
# FORMAT:  <glob>: [<command>, ...]   — commands run from the repo root.
# A `<glob>/**` entry matches anything under that directory.
# The commands must FAIL when the change is broken. A command that cannot fail is not a check.
#
# This file ships EMPTY: game_loop does not know your project. `verify` and the commit gate are no-ops
# until you add rules. Examples (delete and replace with your own):
#
# "src/**":
#   - "npm test"
#   - "npm run lint"
#
# "schema/*.sql":
#   - "./scripts/apply-migrations.sh --dry-run"
#
# COVERAGE — a map of listed paths defaults to OWES-NOTHING, so a path nobody listed passes
# `verify --check` in perfect silence. That is how a whole new package gets built, hand-tested and
# committed with the gate reporting clean: green meant "nothing LISTED here is stale", never
# "nothing is unverified". So coverage is computed the other way round — every changed path counts
# as UNCHECKED until a rule claims it or you exclude it here. Ask at any time:
#
#     ./.game_loop/bin/verify --coverage
#
# `game_loop status` re-prints the same set every session, and the write guard names it at
# `git commit`. While this file is empty that report says so plainly: nothing is checked.
#
# The one reserved key. Its entries are GLOBS, not commands — paths that genuinely need no check:
#
# "unchecked-ok":
#   - "docs/**"
#   - "*.md"
#
# Excluding is a stated decision that stays visible in this file and is counted in every report.
# Leaving something UNCHECKED is fine too — it just says so out loud on every commit that touches
# it. Being unchecked NEVER blocks: this file ships empty, so "unlisted ⇒ refused" would refuse
# your first commit with the fix sitting behind the gate. Want the strict version? Opt in with a
# catch-all rule:  "*": ["<your test command>"].

# ─────────────────────────────────────────────────────────────────────────────
# sprout's rules.
#
# Added because the P1-01 Crawler observed the failure this file's own COVERAGE
# note predicts: an entire new Dart package was built, tested and committed with
# the gate reporting clean, because nothing was listed. That is INV8 — a pass
# that is silence proves nothing on its own.
#
# ON "GATE ON THE COMMAND CI RUNS": there is no CI here yet. The commands that
# actually decide whether a change is good in this repo are showrunner's
# integration checks, re-run on each MERGED result against the recorded
# baseline. These three are those commands, byte for byte — see
# .showrunner/config.json -> checks. If CI arrives later and diverges, this is
# the file that has to move first.

"sproutd/**":
  - "cd sproutd && dart format --output=none --set-exit-if-changed ."
  - "cd sproutd && dart analyze --fatal-infos --fatal-warnings"
  - "cd sproutd && dart test"

# Named exclusions, each a decision rather than an oversight.
#
#   docs/**, *.md   prose and captured research. The Phase 0 fixtures under
#                   docs/research/fixtures/ are inert JSON — they are read by
#                   sproutd's tests, and a change that breaks them fails under
#                   the sproutd/** rule above, which is where it should fail.
#   .game_loop/**   this harness's own rules and state. A gate that gates its
#                   own gate file has no fixed point, and INV5 says a guard
#                   must never block its own fix.
#   .showrunner/**  campaign state and config, same reasoning.
#   .claude/**      hook registration, read by Claude Code at session start and
#                   not executable by any check here.
#
# NOT excluded, and deliberately so: sprout_ui/ does not exist yet (Phase 3).
# When it lands it will be UNCHECKED and will say so on every commit that
# touches it, which is the correct loud default until it has a real check.
"unchecked-ok":
  - "docs/**"
  - "*.md"
  - ".game_loop/**"
  - ".showrunner/**"
  - ".claude/**"
